name: Regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r ../backend/requirements.txt
      - name: Check production routes and API forwarding
        run: |
          python scripts/preview-api.py > /tmp/lumitudy-api.log 2>&1 &
          api_pid=$!
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/lumitudy-next.log 2>&1 &
          next_pid=$!
          trap 'kill "$next_pid" "$api_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/auth/session > /dev/null; then break; fi
            sleep 1
          done
          npm run check:preview -- http://127.0.0.1:3000
          python scripts/check-api-proxy.py http://127.0.0.1:3000
